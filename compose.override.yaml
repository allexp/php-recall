services:
  database:
    ports:
      - "5433:5432"

  app:
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
    volumes:
      - ./bin:/app/bin
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./public:/app/public
      - ./src:/app/src
      - ./templates:/app/templates
