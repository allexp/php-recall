services:
  database:
    ports:
      - "5433:5432"

  app:
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    volumes:
      - ./bin:/app/bin
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./public/app.css:/app/public/app.css
      - ./public/app.js:/app/public/app.js
      - ./public/admin-material-category-filter.js:/app/public/admin-material-category-filter.js
      - ./public/favicon.png:/app/public/favicon.png
      - ./public/index.php:/app/public/index.php
      - ./public/sandbox-editor.js:/app/public/sandbox-editor.js
      - ./src:/app/src
      - ./templates:/app/templates
      - ./ops/php/opcache-development.ini:/usr/local/etc/php/conf.d/zz-opcache-development.ini:ro

  web:
    volumes:
      - ./public/app.css:/app/public/app.css:ro
      - ./public/app.js:/app/public/app.js:ro
      - ./public/admin-material-category-filter.js:/app/public/admin-material-category-filter.js:ro
      - ./public/favicon.png:/app/public/favicon.png:ro
      - ./public/sandbox-editor.js:/app/public/sandbox-editor.js:ro
