services:
  app:
    build: .
    container_name: php-recall
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - php-recall-data:/app/data
    networks:
      - scheduler_backend
      - sandbox_internal
      - database_internal
    mem_limit: 192m
    environment:
      SANDBOX_RUNNER_URL: http://sandbox-runner:8080
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set}
      SYMFONY_TRUSTED_PROXIES: REMOTE_ADDR
      SYMFONY_TRUSTED_HEADERS: x-forwarded-proto
    depends_on:
      database:
        condition: service_healthy
      sandbox-runner:
        condition: service_started

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: php_recall
      POSTGRES_USER: php_recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - php-recall-postgres:/var/lib/postgresql/data
    networks:
      - database_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U php_recall -d php_recall"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m

  sandbox-runner:
    image: php-recall-sandbox:local
    build:
      context: sandbox
    environment:
      SANDBOX_IMAGE: php-recall-sandbox:local
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GID:?DOCKER_GID must be set}
    networks:
      - sandbox_internal
    restart: unless-stopped
    mem_limit: 96m

networks:
  scheduler_backend:
    external: true
  sandbox_internal:
    internal: true
  database_internal:
    internal: true

volumes:
  php-recall-data:
  php-recall-postgres:
