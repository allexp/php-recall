services:
  app:
    build: .
    container_name: php-recall
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - php-recall-data:/app/data
    networks:
      - scheduler_backend
    mem_limit: 192m

networks:
  scheduler_backend:
    external: true

volumes:
  php-recall-data:
