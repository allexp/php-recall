services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Command\ImportSqliteDataCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\SandboxClient:
        arguments:
            $runnerUrl: '%env(SANDBOX_RUNNER_URL)%'
            $runnerToken: '%env(SANDBOX_TOKEN)%'
