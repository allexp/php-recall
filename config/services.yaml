parameters:
    app.manual_cache_directory: '%kernel.cache_dir%/php-manual'
    app.user_database: '%kernel.project_dir%/data/users.sqlite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\ManualService:
        arguments:
            $cacheDirectory: '%app.manual_cache_directory%'

    App\Service\FunctionCatalog:
        arguments:
            $catalogFile: '%kernel.project_dir%/config/catalog.php'

    App\Service\UserStore:
        arguments:
            $databaseFile: '%app.user_database%'
