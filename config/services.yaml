parameters:
    app.material_database: '%kernel.project_dir%/data/materials.sqlite'
    app.user_database: '%kernel.project_dir%/data/users.sqlite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\FunctionCatalog:
        arguments:
            $catalogFile: '%kernel.project_dir%/config/catalog.php'

    App\Service\MaterialStore:
        arguments:
            $databaseFile: '%app.material_database%'

    App\Service\ConceptCatalog:
        arguments:
            $catalogFile: '%kernel.project_dir%/config/concepts.php'

    App\Service\UserStore:
        arguments:
            $databaseFile: '%app.user_database%'

    App\Service\SandboxClient:
        arguments:
            $runnerUrl: '%env(SANDBOX_RUNNER_URL)%'
            $runnerToken: '%env(SANDBOX_TOKEN)%'
