parameters:
    app.default_material_database: '%kernel.project_dir%/data/materials.sqlite'
    app.material_database: '%env(default:app.default_material_database:MATERIAL_DATABASE)%'
    app.user_database: '%kernel.project_dir%/data/users.sqlite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\MaterialStore:
        arguments:
            $databaseFile: '%app.material_database%'

    App\Service\TaskStore:
        arguments:
            $databaseFile: '%app.material_database%'

    App\Service\UserStore:
        arguments:
            $databaseFile: '%app.user_database%'

    App\Service\SandboxClient:
        arguments:
            $runnerUrl: '%env(SANDBOX_RUNNER_URL)%'
            $runnerToken: '%env(SANDBOX_TOKEN)%'
